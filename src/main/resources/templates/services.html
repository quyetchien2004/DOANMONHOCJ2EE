<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dịch vụ | Golden Lotus</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('services', 'light')}"
    ></th:block>

    <main class="container py-4">
      <section class="page-head-card mb-3">
        <h2 class="mb-1">Dịch vụ nổi bật</h2>
        <p class="text-muted mb-0">
          Hệ thống phòng đa dạng, giá linh hoạt, và quy trình booking nhanh gọn.
        </p>
      </section>
      <div class="row g-3">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body"><h5>Đặt phòng theo giờ/ngày</h5></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body"><h5>Voucher theo nhóm khách</h5></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body"><h5>Quản trị chi nhánh và phòng</h5></div>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
