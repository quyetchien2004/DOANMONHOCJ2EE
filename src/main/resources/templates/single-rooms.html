<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết phòng | Golden Lotus</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('booking', 'light')}"
    ></th:block>

    <main class="container py-4">
      <article class="card">
        <div class="card-body">
          <h2>Chi tiết loại phòng</h2>
          <p>
            Trang này mô tả thông tin phòng theo sức chứa, loại phòng, giá tham
            khảo và tiện ích. Để đặt phòng, vui lòng chuyển sang trang Đặt phòng
            để tìm phòng trống theo thời gian cụ thể.
          </p>
          <a class="btn btn-brand" th:href="@{/room}">Đi đến Đặt phòng</a>
        </div>
      </article>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
