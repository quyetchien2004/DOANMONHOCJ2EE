<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dự án &amp; Gallery | Golden Lotus</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('about', 'light')}"
    ></th:block>

    <main class="container py-4">
      <section class="page-head-card mb-3">
        <h2 class="mb-1">Gallery hệ thống</h2>
        <p class="text-muted mb-0">
          Tổng hợp hình ảnh chi nhánh, không gian phòng và dịch vụ nổi bật.
        </p>
      </section>
      <div class="card">
        <div class="card-body">
          <p class="mb-0">
            Nội dung gallery đang được tối ưu. Bạn có thể tiếp tục trải nghiệm
            bộ lọc đặt phòng để xem kết quả thực tế.
          </p>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
