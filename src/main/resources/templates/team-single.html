<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hồ sơ thành viên | Golden Lotus</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('about', 'light')}"
    ></th:block>

    <main class="container py-4">
      <article class="card">
        <div class="card-body">
          <h2>Hồ sơ thành viên</h2>
          <p>
            Trang profile chi tiết thành viên sẽ được bổ sung module dữ liệu
            sau.
          </p>
          <a class="btn btn-brand" th:href="@{/team}">Quay lại Team</a>
        </div>
      </article>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
