<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết dịch vụ | CCT Hotels Company</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('services', 'light')}"
    ></th:block>

    <main class="container py-4">
      <article class="card">
        <div class="card-body">
          <h2>Chi tiết dịch vụ</h2>
          <p>
            Nội dung chi tiết dịch vụ được cập nhật theo từng chi nhánh. Các gói
            dịch vụ có thể đi kèm voucher và sẽ được tính vào booking khi đặt
            phòng.
          </p>
          <a class="btn btn-brand" th:href="@{/services}">Quay lại Dịch vụ</a>
        </div>
      </article>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
