<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trang chủ 2 | CCT Hotels Company</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('home', 'light')}"
    ></th:block>

    <main class="container py-4">
      <section class="page-head-card mb-3">
        <h2 class="mb-1">Trang chủ phiên bản 2</h2>
        <p class="text-muted mb-0">
          Biến thể bố cục đơn giản sử dụng chung hệ thống điều hướng và footer.
        </p>
      </section>
      <div class="card">
        <div class="card-body">
          <a class="btn btn-brand" th:href="@{/}">Về trang chủ chính</a>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
