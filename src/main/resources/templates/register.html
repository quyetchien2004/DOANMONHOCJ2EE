<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="text-center mb-4">Đăng ký tài khoản</h3>

            <p th:if="${error}" th:text="${error}" class="text-danger text-center"></p>

            <form th:action="@{/register}" method="post" th:object="${user}">

                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" th:field="*{username}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" th:field="*{fullName}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Đăng ký
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
