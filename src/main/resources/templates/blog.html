<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog | Golden Lotus</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('blog', 'light')}"
    ></th:block>

    <main class="container py-4">
      <section class="page-head-card mb-3">
        <h2 class="mb-1">Blog dịch vụ</h2>
        <p class="text-muted mb-0">
          Cập nhật kinh nghiệm du lịch, ưu đãi, và cách sử dụng hệ thống đặt
          phòng hiệu quả.
        </p>
      </section>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <h5>Mẹo đặt phòng vào mùa cao điểm</h5>
              <p class="mb-0">
                Xem cách lọc theo khu vực và giá tối đa để ra kết quả phù hợp.
              </p>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card h-100">
            <div class="card-body">
              <h5>Cách áp dụng voucher đúng đối tượng</h5>
              <p class="mb-0">
                Hiểu quy tắc NEW_USER, LOYAL_USER, FREQUENT_USER để tránh lỗi.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
