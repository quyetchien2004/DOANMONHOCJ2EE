<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản lý người dùng | CCT Hotels Company</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('users', 'light')}"
    ></th:block>
    <div class="container py-4">
      <div class="page-head-card mb-3">
        <h2 class="mb-1">Quản lý người dùng</h2>
        <p class="text-muted mb-0">
          Tạo nhanh tài khoản mới và xem danh sách user hiện có.
        </p>
      </div>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card h-100">
            <div class="card-header fw-bold">Thêm người dùng mới</div>
            <div class="card-body">
              <form action="/users" method="post" class="d-grid gap-2">
                <input
                  class="form-control"
                  type="text"
                  name="username"
                  placeholder="Username"
                  required
                />
                <input
                  class="form-control"
                  type="password"
                  name="password"
                  placeholder="Password"
                  required
                />
                <input
                  class="form-control"
                  type="text"
                  name="fullName"
                  placeholder="Họ và tên"
                  required
                />
                <input
                  class="form-control"
                  type="email"
                  name="email"
                  placeholder="Email"
                  required
                />
                <input
                  class="form-control"
                  type="text"
                  name="phone"
                  placeholder="Số điện thoại"
                  required
                />
                <button type="submit" class="btn btn-brand">Thêm user</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card">
            <div class="card-header fw-bold">Danh sách user</div>
            <div class="card-body table-responsive">
              <table
                class="table table-sm table-striped align-middle mb-0 booking-table"
              >
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.phone}"></td>
                    <td>
                      <span
                        class="badge rounded-pill bg-secondary"
                        th:text="${user.role}"
                      ></span>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div
                class="alert alert-info mt-3 mb-0"
                th:if="${#lists.isEmpty(users)}"
              >
                Chưa có user nào. Hãy thêm user mới ở cột bên trái.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>

    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
