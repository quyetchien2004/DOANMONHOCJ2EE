<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bảng giá | CCT Hotels Company</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('services', 'light')}"
    ></th:block>

    <main class="container py-4">
      <section class="page-head-card mb-3">
        <h2 class="mb-1">Bảng giá tham khảo</h2>
        <p class="text-muted mb-0">
          Giá thực tế được tính theo bộ lọc tìm phòng và thời điểm đặt phòng.
        </p>
      </section>
      <div class="card">
        <div class="card-body">
          <p class="mb-0">
            Giá theo giờ/ngày, phụ thu ngày lễ và voucher được hệ thống tính tự
            động trong quá trình tạo booking.
          </p>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
