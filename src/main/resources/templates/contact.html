<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liên hệ | CCT Hotels Company</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('contact', 'light')}"
    ></th:block>

    <main class="container py-4">
      <section class="page-head-card mb-3">
        <h2 class="mb-1">Liên hệ</h2>
        <p class="text-muted mb-0">
          Cần hỗ trợ về đặt phòng, voucher, hoặc quản trị tài khoản? Liên hệ
          ngay với chúng tôi.
        </p>
      </section>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-body">
              <h5>Thông tin vận hành</h5>
              <p class="mb-1"><i class="fa-solid fa-phone"></i> 0900 123 456</p>
              <p class="mb-1">
                <i class="fa-solid fa-envelope"></i> support@ccthotels.vn
              </p>
              <p class="mb-0">
                <i class="fa-solid fa-location-dot"></i> 123 Nguyen Hue, Da Nang
              </p>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card h-100">
            <div class="card-body">
              <h5>Điều hướng nhanh</h5>
              <a class="btn btn-brand me-2 mb-2" th:href="@{/room}"
                >Đặt phòng</a
              >
              <a
                class="btn btn-outline-secondary mb-2"
                th:href="@{/my-bookings}"
                >Đơn của tôi</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
