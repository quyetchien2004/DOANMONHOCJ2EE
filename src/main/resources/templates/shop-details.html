<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết ưu đãi | CCT Hotels Company</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('shop', 'light')}"
    ></th:block>

    <main class="container py-4">
      <article class="card">
        <div class="card-body">
          <h2>Chi tiết gói ưu đãi</h2>
          <p>
            Gói ưu đãi sẽ được áp dụng tuỳ theo loại phòng, thời gian lưu trú và
            điều kiện voucher. Bạn có thể kiểm tra ngay trên hệ thống tìm phòng
            để thấy giá tạm tính thực tế.
          </p>
          <a class="btn btn-brand" th:href="@{/shop}">Quay lại Shop</a>
        </div>
      </article>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
