<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết bài viết | Golden Lotus</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/booking-modern.css}" />
  </head>
  <body class="app-page">
    <th:block
      th:replace="~{fragments/layout :: siteHeader('blog', 'light')}"
    ></th:block>

    <main class="container py-4">
      <article class="card">
        <div class="card-body">
          <h2>Hướng dẫn tối ưu bộ lọc đặt phòng</h2>
          <p class="text-muted">Cập nhật: 11/03/2026</p>
          <p>
            Để có kết quả tìm phòng chính xác, bạn nên chọn đúng kiểu thuê
            (giờ/ngày), nhập thời gian hợp lệ, và sử dụng thêm bộ lọc giá tối
            đa. Nếu đã có vị trí, hãy sử dụng GPS tại trang đặt phòng.
          </p>
          <a class="btn btn-brand" th:href="@{/blog}">Quay lại Blog</a>
        </div>
      </article>
    </main>

    <th:block th:replace="~{fragments/layout :: siteFooter}"></th:block>
    <script th:src="@{/js/bootstrap.min.js}"></script>
  </body>
</html>
